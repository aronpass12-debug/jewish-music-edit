name: Refresh Jewish music news
on:
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh source-linked music headlines
        run: python scripts/refresh_news.py
      - name: Save updated feed and RSS
        run: |
          python scripts/make_feed.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Jewish music headlines [skip ci]"
            git push
          fi
